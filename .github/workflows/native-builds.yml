name: Native build verification

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to verify
        type: choice
        default: all
        options: [all, native, linux, flatpak, flatpak-verify, macos, windows, audit, publish]
      release_tag:
        description: Stable release tag (publish only)
        type: string
        default: v0.2.0
      windows_run:
        description: Validated Windows artifact run (publish only)
        type: string
      linux_run:
        description: Existing Linux artifact run (publish or Flatpak verify)
        type: string
      linux_verification_run:
        description: Successful installed Flatpak verification run (publish only)
        type: string
      macos_run:
        description: Validated Mac Intel and ARM artifact run (publish only)
        type: string
  push:
    branches: [release/first-stable]

permissions:
  contents: read

concurrency:
  group: native-${{ github.ref }}-${{ inputs.platform || 'all' }}
  cancel-in-progress: true

env:
  CARGO_BUILD_JOBS: 2
  CMAKE_BUILD_PARALLEL_LEVEL: 2

jobs:
  flatpak-verify:
    if: github.event_name == 'workflow_dispatch' && inputs.platform == 'flatpak-verify' && github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Download the source-compatible Flatpak package
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ inputs.linux_run }}
        run: |
          python3 - <<'PY'
          import hashlib, importlib.util, json, os, pathlib, re, subprocess
          spec = importlib.util.spec_from_file_location('publisher', 'scripts/rust/publish-release.py')
          p = importlib.util.module_from_spec(spec); spec.loader.exec_module(p)
          number, repo = os.environ['SOURCE_RUN'], os.environ['GITHUB_REPOSITORY']
          p.require(re.fullmatch(r'[1-9][0-9]*', number), 'Invalid artifact run')
          run = p.api(f'repos/{repo}/actions/runs/{number}')
          p.require(run['status'] == 'completed' and run['repository']['full_name'] == repo, 'Invalid producer')
          p.require(re.fullmatch(r'[0-9a-f]{40}', run['head_sha']), 'Invalid producer SHA')
          diff = subprocess.run(['git', 'diff', '--name-only', run['head_sha'], os.environ['GITHUB_SHA']], capture_output=True, text=True)
          p.require(diff.returncode == 0 and p.producer_sources_match(diff.stdout.splitlines(), 'linux'), 'Different runtime source')
          jobs = p.api(f'repos/{repo}/actions/runs/{number}/jobs?per_page=100')['jobs']
          p.require(any(j['name'] == 'linux-flatpak' and p.succeeded(j, ['Build and package against the Flatpak SDK']) for j in jobs), 'Package build did not pass')
          artifacts = p.api(f'repos/{repo}/actions/runs/{number}/artifacts?per_page=100')
          p.require(artifacts['total_count'] <= 100, 'Unexpected artifact count')
          matches = [a for a in artifacts['artifacts'] if a['name'] == 'VideoDock-linux-flatpak-x86_64']
          p.require(len(matches) == 1 and not matches[0]['expired'], 'Expected one available Flatpak artifact')
          artifact = matches[0]
          p.require(type(artifact['id']) is int and artifact['id'] > 0 and re.fullmatch(r'sha256:[0-9a-f]{64}', artifact.get('digest') or ''), 'Invalid artifact identity')
          output = pathlib.Path(os.environ['RUNNER_TEMP']) / 'flatpak-input'
          p.gh('run', 'download', number, '--repo', repo, '--name', artifact['name'], '--dir', str(output))
          entries = list(output.rglob('*'))
          p.require(all(not f.is_symlink() and f.is_file() and f.parent == output for f in entries), 'Unexpected package layout')
          packages = [f for f in entries if f.suffix == '.flatpak']
          p.require(len(packages) == 1 and all(f.name in (packages[0].name, 'SHA256SUMS') for f in entries), 'Expected one Flatpak package')
          package = packages[0]
          p.require(0 < package.stat().st_size < 2 * 1024**3, 'Invalid package size')
          with package.open('rb') as stream: digest = hashlib.file_digest(stream, 'sha256').hexdigest()
          report = pathlib.Path(os.environ['RUNNER_TEMP']) / 'flatpak-verification'
          report.mkdir()
          (report / 'input.json').write_text(json.dumps({'version': 1, 'producer_run_id': int(number), 'source_sha': run['head_sha'], 'artifact_id': artifact['id'], 'artifact_digest': artifact['digest'], 'package_name': package.name, 'package_sha256': digest}, indent=2) + '\n')
          PY
      - name: Install only the tested runtime package
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak dbus-user-session xvfb xauth x11-utils xdg-desktop-portal-gtk
          sudo loginctl enable-linger "$USER"
          sudo systemctl start "user@$(id -u).service"
          echo "XDG_RUNTIME_DIR=/run/user/$(id -u)" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$(id -u)/bus" >> "$GITHUB_ENV"
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user --noninteractive -y "$RUNNER_TEMP"/flatpak-input/VideoDock-*-linux-x86_64.flatpak
      - name: Verify installed Flatpak worker and visible window
        run: |
          xvfb-run -a -s '-screen 0 1280x800x24' bash <<'SH'
          set -eu
          report="$RUNNER_TEMP/flatpak-verification"
          trap 'flatpak kill io.github.Nezeronxer.VideoDock 2>/dev/null || true' EXIT
          export XDG_CURRENT_DESKTOP=GNOME
          test -n "$DISPLAY"
          test -r "$XAUTHORITY"
          dbus-update-activation-environment --systemd DISPLAY XAUTHORITY XDG_CURRENT_DESKTOP
          mkdir -p "$HOME/.config/xdg-desktop-portal"
          printf '%s\n' '[preferred]' 'default=gtk' 'org.freedesktop.impl.portal.Settings=gtk' > "$HOME/.config/xdg-desktop-portal/gnome-portals.conf"
          systemctl --user daemon-reload
          timeout 20s systemctl --user restart xdg-desktop-portal-gtk.service
          timeout 20s systemctl --user restart xdg-desktop-portal.service
          python3 - <<'PY' > "$report/portal.log"
          import subprocess, time
          command = ['gdbus', 'call', '--session', '--dest', 'org.freedesktop.portal.Desktop', '--object-path', '/org/freedesktop/portal/desktop', '--method', 'org.freedesktop.portal.Settings.ReadAll', "['org.freedesktop.appearance']"]
          deadline = time.monotonic() + 10
          while time.monotonic() < deadline:
              try:
                  if subprocess.run(command, capture_output=True, timeout=2).returncode == 0:
                      print('Portal Settings preflight PASS'); break
              except subprocess.TimeoutExpired: pass
              time.sleep(.2)
          else: raise SystemExit('Portal Settings preflight failed')
          PY
          flatpak run --command=ffmpeg io.github.Nezeronxer.VideoDock -version > "$report/ffmpeg.log" 2>&1
          flatpak run --command=ffprobe io.github.Nezeronxer.VideoDock -version > "$report/ffprobe.log" 2>&1
          printf '%s\n' '#!/bin/sh' 'exec flatpak run --env=QT_QPA_PLATFORM=offscreen --command=videodock io.github.Nezeronxer.VideoDock "$@"' > "$report/flatpak-worker"
          chmod +x "$report/flatpak-worker"
          python3 crates/desktop/tests/proof_worker.py "$report/flatpak-worker" --proxy --startup > "$report/worker.log" 2>&1
          flatpak kill io.github.Nezeronxer.VideoDock 2>/dev/null || true
          python3 - <<'PY'
          import json, os, pathlib, re, subprocess, time, uuid
          report = pathlib.Path(os.environ['RUNNER_TEMP']) / 'flatpak-verification'
          diagnostic = {'instances': 0, 'matching_windows': 0, 'viewable_windows': 0, 'window_pids': [], 'own_pids': [], 'proc_errors': 0, 'stale_processes': 0}
          def own_pids():
              result = subprocess.run(['flatpak', 'ps', '--columns=pid,application'], capture_output=True, text=True, timeout=1)
              roots = {int(row[0]) for line in result.stdout.splitlines() if len(row := line.split()) == 2 and row[0].isdigit() and row[1] == 'io.github.Nezeronxer.VideoDock'}
              diagnostic['instances'] = len(roots)
              if result.returncode or len(roots) != 1: return set()
              parents, starts = {}, {}
              for path in pathlib.Path('/proc').iterdir():
                  if not path.name.isdigit(): continue
                  try:
                      fields = (path / 'stat').read_text().rpartition(') ')[2].split()
                      parents[int(path.name)], starts[int(path.name)] = int(fields[1]), int(fields[19])
                  except (OSError, ValueError, IndexError): pass
              selected = roots.copy()
              while children := {pid for pid, parent in parents.items() if parent in selected} - selected: selected.update(children)
              output = set()
              for pid in selected:
                  path = pathlib.Path('/proc') / str(pid)
                  try:
                      if starts.get(pid, 0) < launch_tick:
                          diagnostic['stale_processes'] += 1; continue
                      if (path / 'exe').readlink().name != 'videodock' or b'--youtube-proof' in (path / 'cmdline').read_bytes().split(b'\0'): continue
                      line = next(line for line in (path / 'status').read_text().splitlines() if line.startswith('NSpid:'))
                      output.add(int(line.split()[-1]))
                  except (OSError, ValueError, StopIteration): diagnostic['proc_errors'] += 1
              diagnostic['own_pids'] = sorted(output)
              return output
          def command(*args):
              return subprocess.run(args, capture_output=True, text=True, timeout=max(.05, min(1, deadline - time.monotonic())))
          profile = '/tmp/videodock-gui-' + uuid.uuid4().hex
          launch_tick = int(float(pathlib.Path('/proc/uptime').read_text().split()[0]) * os.sysconf('SC_CLK_TCK'))
          app_log = (report / 'gui-app.log').open('wb')
          process = subprocess.Popen(['flatpak', 'run', '--env=QT_QPA_PLATFORM=xcb', '--env=VIDEODOCK_DATA_DIR=' + profile, '--command=videodock', 'io.github.Nezeronxer.VideoDock'], stdout=app_log, stderr=subprocess.STDOUT)
          visible = False
          try:
              deadline = time.monotonic() + 10
              while time.monotonic() < deadline:
                  if process.poll() is not None: raise RuntimeError('Installed GUI exited before a visible window')
                  try:
                      tree = command('xwininfo', '-root', '-tree')
                      windows = re.findall(r'^\s*(0x[0-9a-fA-F]+)\s+"VideoDock":', tree.stdout, re.M)
                      diagnostic['matching_windows'] = len(windows)
                      for window in windows:
                          info = command('xwininfo', '-id', window)
                          owner = command('xprop', '-id', window, '_NET_WM_PID')
                          match = re.search(r'=\s*(\d+)\s*$', owner.stdout)
                          if match: diagnostic['window_pids'] = sorted(set(diagnostic['window_pids']) | {int(match[1])})
                          if re.search(r'^\s*Map State:\s*IsViewable\s*$', info.stdout, re.M): diagnostic['viewable_windows'] += 1
                          if info.returncode == 0 and owner.returncode == 0 and match and int(match[1]) in own_pids() and re.search(r'^\s*Map State:\s*IsViewable\s*$', info.stdout, re.M) and time.monotonic() < deadline:
                              (report / 'gui-window.log').write_text(info.stdout)
                              visible = True; break
                      if visible: break
                  except subprocess.TimeoutExpired: pass
                  time.sleep(.1)
              if not visible: raise RuntimeError('Own visible VideoDock window not observed within 10s')
          finally:
              try: subprocess.run(['flatpak', 'kill', 'io.github.Nezeronxer.VideoDock'], stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL, timeout=5, check=False)
              finally:
                  if process.poll() is None: process.kill()
                  process.wait(timeout=5)
                  app_log.close()
                  diagnostic['visible'] = visible
                  (report / 'gui-state.json').write_text(json.dumps(diagnostic, indent=2) + '\n')
                  with (report / 'gui-app.log').open('r+b') as stream: stream.truncate(min(stream.seek(0, 2), 65536))
          metadata = json.loads((report / 'input.json').read_text())
          assert set(metadata) == {'version', 'producer_run_id', 'source_sha', 'artifact_id', 'artifact_digest', 'package_name', 'package_sha256'}
          (report / 'verification.json').write_text(json.dumps({**metadata, 'worker_proxy': True, 'worker_startup': True, 'gui_visible': True}, indent=2) + '\n')
          print('Installed Flatpak worker, startup and owned visible window PASS')
          PY
          SH
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: flatpak-verification
          path: ${{ runner.temp }}/flatpak-verification
          if-no-files-found: warn

  publish:
    if: github.event_name == 'workflow_dispatch' && inputs.platform == 'publish' && github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_HOST: github.com
      RELEASE_TAG: ${{ inputs.release_tag }}
      WINDOWS_RUN: ${{ inputs.windows_run }}
      LINUX_RUN: ${{ inputs.linux_run }}
      LINUX_VERIFICATION_RUN: ${{ inputs.linux_verification_run }}
      MACOS_RUN: ${{ inputs.macos_run }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: python3 scripts/rust/publish-release.py --self-test
      - run: python3 scripts/rust/publish-release.py

  dependency-audit:
    if: github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'audit'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install pinned RustSec audit tool
        run: cargo install cargo-audit --locked --version 0.22.2
      - name: Audit locked dependencies
        run: cargo audit --file Cargo.lock --json > "$RUNNER_TEMP/dependency-audit.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: dependency-audit
          path: ${{ runner.temp }}/dependency-audit.json
          if-no-files-found: warn

  linux:
    if: github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'native' || inputs.platform == 'linux'
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    timeout-minutes: 90
    env:
      # These localhost fixtures run as root in a disposable container.
      QTWEBENGINE_DISABLE_SANDBOX: "1"
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - run: pacman -Syu --noconfirm rust git cmake ninja clang pkgconf qt6-base qt6-declarative qt6-webengine qt6-tools qt6-5compat qt6-svg ffmpeg xdg-utils xorg-server-xvfb xorg-xauth
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: echo "QT_VERSION=$(pkg-config --modversion Qt6Core)" >> "$GITHUB_ENV"
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        id: linux-cache
        with:
          path: |
            ${{ github.workspace }}/target
            ~/.cargo/registry
          key: native-arch-x64-${{ env.QT_VERSION }}-${{ hashFiles('Cargo.lock') }}
      - run: python3 -m unittest discover -s scripts/rust/tests -p test_install_staging.py -v
      - run: PATH="/usr/lib/qt6/bin:$PATH" python3 crates/desktop/tests/check-manual-checkbox.py
      - run: cargo test --workspace --locked
      - run: sh scripts/rust/build.sh
      - name: Verify Linux interface in English and Russian
        run: |
          mkdir -p "$RUNNER_TEMP/linux-interface"
          failed=0
          for language in en ru; do
            sh crates/desktop/tests/check-appearance.sh "$RUNNER_TEMP/linux-interface/$language" "$language" > "$RUNNER_TEMP/linux-interface/$language.log" 2>&1 || failed=1
          done
          exit "$failed"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: linux-interface
          path: ${{ runner.temp }}/linux-interface
          if-no-files-found: warn
      - run: sh crates/desktop/tests/check-browser-proxy.sh
      - run: sh crates/desktop/tests/check-cookie-bridge.sh
      - run: sh crates/desktop/tests/check-proof-boundaries.sh
      # Valid proofs require Chromium sandboxing; this root container checks IPC only.
      # Native Windows/macOS jobs also exercise the packaged WebEngine worker.
      - run: python3 crates/desktop/tests/proof_worker.py "$CARGO_TARGET_DIR/release/videodock-desktop" --startup
      - name: Package native Arch Linux build
        run: |
          cargo fetch --locked
          python3 LICENSES/generate-rust-licenses.py --check
          package="$RUNNER_TEMP/VideoDock-linux-arch-x86_64"
          mkdir -p "$package/bin" "$package/licenses"
          install -m755 "$CARGO_TARGET_DIR/release/videodock-desktop" "$package/bin/videodock"
          cp -R LICENSES/. "$package/licenses/"
          cp THIRD-PARTY-NOTICES.md "$package/"
          cp crates/desktop/attestation/bgutils/LICENSE "$package/licenses/BgUtils-MIT.txt"
          cp crates/core/src/sabr/LICENSE.googlevideo "$package/licenses/googlevideo-MIT.txt"
          cp crates/core/src/sabr/LICENSE.sabr-rs "$package/licenses/sabr-rs-MIT.txt"
          ffmpeg -L > "$package/licenses/ffmpeg-license.txt" 2>&1
          ffmpeg -buildconf > "$package/licenses/ffmpeg-buildconf.txt" 2>&1
          printf '%s\n' 'Arch Linux x86_64 build. Install matching runtime packages: qt6-base qt6-declarative qt6-webengine qt6-5compat qt6-svg ffmpeg xdg-utils. Run bin/videodock. Other distributions require a matching build or Flatpak; this is not a portable glibc bundle.' > "$package/README.txt"
          tar -czf "$RUNNER_TEMP/VideoDock-linux-arch-x86_64.tar.gz" -C "$RUNNER_TEMP" VideoDock-linux-arch-x86_64
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: VideoDock-linux-arch-x86_64
          path: ${{ runner.temp }}/VideoDock-linux-arch-x86_64.tar.gz
          if-no-files-found: error

      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        if: always() && steps.linux-cache.outcome == 'success' && steps.linux-cache.outputs.cache-hit != 'true'
        with:
          path: |
            ${{ github.workspace }}/target
            ~/.cargo/registry
          key: native-arch-x64-${{ env.QT_VERSION }}-${{ hashFiles('Cargo.lock') }}

  linux-flatpak:
    if: github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'linux' || inputs.platform == 'flatpak'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install Flatpak SDK and matching WebEngine
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak appstream dbus-user-session librsvg2-common libgdk-pixbuf2.0-bin
          gdk-pixbuf-thumbnailer -s 64 assets/videodock.svg "$RUNNER_TEMP/flatpak-icon.png"
          sudo loginctl enable-linger "$USER"
          sudo systemctl start "user@$(id -u).service"
          echo "XDG_RUNTIME_DIR=/run/user/$(id -u)" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$(id -u)/bus" >> "$GITHUB_ENV"
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          for ref in runtime/org.kde.Platform/x86_64/6.11 runtime/org.kde.Sdk/x86_64/6.11 app/io.qt.qtwebengine.BaseApp/x86_64/6.11 runtime/org.freedesktop.Sdk.Extension.llvm22/x86_64/25.08; do
            flatpak remote-info --user flathub "$ref"
            flatpak install --user --noninteractive -y flathub "$ref"
          done
          rustup toolchain install 1.99.1 --profile minimal
          rustup override set 1.99.1
          echo "FLATPAK_SDK_COMMIT=$(flatpak info --user --show-commit org.kde.Sdk//6.11)" >> "$GITHUB_ENV"
          echo "FLATPAK_BASE_COMMIT=$(flatpak info --user --show-commit io.qt.qtwebengine.BaseApp//6.11)" >> "$GITHUB_ENV"
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        id: flatpak-cache
        with:
          path: ~/.cache/videodock-flatpak/sdk-target
          key: flatpak-x64-1.99.1-${{ env.FLATPAK_SDK_COMMIT }}-${{ env.FLATPAK_BASE_COMMIT }}-${{ hashFiles('Cargo.lock', 'packaging/linux/*') }}
      - name: Prepare offline sources and writable SDK
        run: |
          test -S "$XDG_RUNTIME_DIR/bus"
          systemctl --user show-environment >/dev/null
          cargo vendor --locked "$RUNNER_TEMP/videodock-vendor"
          python3 LICENSES/generate-rust-licenses.py --check
          flatpak build-init --arch=x86_64 --writable-sdk --sdk-extension=org.freedesktop.Sdk.Extension.llvm22 --base=io.qt.qtwebengine.BaseApp --base-version=6.11 "$RUNNER_TEMP/videodock-base" io.github.Nezeronxer.VideoDock org.kde.Sdk org.kde.Platform 6.11
          flatpak build "$RUNNER_TEMP/videodock-base" sh -ec 'test -f /usr/lib/sdk/llvm22/lib/libclang.so; /usr/bin/qmake -query QT_VERSION; test -f /app/lib/libexec/QtWebEngineProcess'
      - name: Build and package against the Flatpak SDK
        run: |
          rust_prefix=$(dirname "$(dirname "$(rustup which --toolchain 1.99.1 rustc)")")
          python3 scripts/rust/build-flatpak.py "$RUNNER_TEMP/videodock-base" "$RUNNER_TEMP/videodock-vendor" "$rust_prefix"
          sh scripts/rust/package-flatpak.sh "$RUNNER_TEMP/videodock-base" "$HOME/.cache/videodock-flatpak/sdk-target/release/videodock-desktop" "$RUNNER_TEMP/linux-artifact"
      - name: Verify installed Flatpak runtime and worker
        run: |
          trap 'flatpak kill io.github.Nezeronxer.VideoDock 2>/dev/null || true' EXIT
          flatpak install --user --noninteractive -y "$RUNNER_TEMP"/linux-artifact/VideoDock-*-linux-x86_64.flatpak
          flatpak run --command=ffmpeg io.github.Nezeronxer.VideoDock -version
          flatpak run --command=ffprobe io.github.Nezeronxer.VideoDock -version
          printf '%s\n' '#!/bin/sh' 'exec flatpak run --command=videodock io.github.Nezeronxer.VideoDock "$@"' > "$RUNNER_TEMP/flatpak-worker"
          chmod +x "$RUNNER_TEMP/flatpak-worker"
          python3 crates/desktop/tests/proof_worker.py "$RUNNER_TEMP/flatpak-worker" --proxy --startup
          sha256sum "$RUNNER_TEMP"/linux-artifact/*.flatpak > "$RUNNER_TEMP/linux-artifact/SHA256SUMS"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: VideoDock-linux-flatpak-x86_64
          path: |
            ${{ runner.temp }}/linux-artifact/*.flatpak
            ${{ runner.temp }}/linux-artifact/SHA256SUMS
          if-no-files-found: warn

      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        if: always() && steps.flatpak-cache.outcome == 'success' && steps.flatpak-cache.outputs.cache-hit != 'true'
        with:
          path: ~/.cache/videodock-flatpak/sdk-target
          key: flatpak-x64-1.99.1-${{ env.FLATPAK_SDK_COMMIT }}-${{ env.FLATPAK_BASE_COMMIT }}-${{ hashFiles('Cargo.lock', 'packaging/linux/*') }}

  macos:
    if: github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'native' || inputs.platform == 'macos'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: macos-15-intel
          - arch: arm64
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: python3 scripts/rust/check-macos-frameworks.py
      - name: Install build tools
        run: |
          brew install qt ffmpeg-full cmake ninja pkgconf
          echo "$(brew --prefix qt)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix ffmpeg-full)/bin" >> "$GITHUB_PATH"
          echo "LIBCLANG_PATH=$(xcrun --find clang | sed 's,/bin/clang$,/lib,')" >> "$GITHUB_ENV"
          rustup toolchain install 1.99.1 --profile minimal
          rustup override set 1.99.1
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        id: macos-cache
        with:
          path: |
            ${{ github.workspace }}/target
            ~/.cargo/registry
          key: native-${{ runner.os }}-${{ runner.arch }}-1.99.1-${{ hashFiles('Cargo.lock') }}
      - run: python3 -m unittest discover -s scripts/rust/tests -p test_install_staging.py -v
      - run: python3 scripts/rust/check-macos-package.py
      - run: python3 crates/desktop/tests/check-manual-checkbox.py
      - run: sh crates/desktop/tests/check-browser-address-focus.sh
      - run: cargo test --workspace --locked
      - name: Build native release before importing signing identity
        run: sh scripts/rust/build.sh
      - name: Verify native macOS interface and real Engine in English and Russian
        timeout-minutes: 15
        run: sh crates/desktop/tests/check-appearance-macos.sh "$RUNNER_TEMP/macos-interface"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: macos-interface-${{ matrix.arch }}
          path: ${{ runner.temp }}/macos-interface
          if-no-files-found: warn
      - name: Import VideoDock signing identity
        env:
          VIDEODOCK_MACOS_CERTIFICATE: ${{ secrets.VIDEODOCK_MACOS_CERTIFICATE }}
          VIDEODOCK_MACOS_CERT_PASSWORD: ${{ secrets.VIDEODOCK_MACOS_CERT_PASSWORD }}
        run: python3 scripts/rust/import-macos-signing.py
      - name: Build and verify application bundle
        id: macos-package
        env:
          VIDEODOCK_MAC_APP: ${{ runner.temp }}/VideoDock.app
        run: |
          sh scripts/rust/install.sh
          "$VIDEODOCK_MAC_APP/Contents/MacOS/ffmpeg" -version
          "$VIDEODOCK_MAC_APP/Contents/MacOS/ffprobe" -version
          PATH=/usr/bin:/bin:/usr/sbin:/sbin /usr/bin/python3 crates/desktop/tests/proof_worker.py "$VIDEODOCK_MAC_APP/Contents/MacOS/VideoDock" --proxy --startup
          ditto -c -k --sequesterRsrc --keepParent "$VIDEODOCK_MAC_APP" "$RUNNER_TEMP/VideoDock-macos-${{ matrix.arch }}.zip"
      - name: Preserve macOS crash diagnostics
        if: failure()
        run: |
          mkdir -p "$RUNNER_TEMP/macos-diagnostics"
          find "$HOME/Library/Logs/DiagnosticReports" -maxdepth 1 -type f \( -name '*VideoDock*' -o -name '*videodock*' -o -name '*QtWebEngineProcess*' \) -exec cp {} "$RUNNER_TEMP/macos-diagnostics/" \; 2>/dev/null || true
      - name: Diagnose packaged worker abort
        if: failure()
        run: |
          python3 scripts/rust/diagnose-macos-worker.py "$RUNNER_TEMP/VideoDock.app/Contents/MacOS/VideoDock" "$RUNNER_TEMP/macos-diagnostics"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: failure()
        with:
          name: macos-crash-diagnostics-${{ matrix.arch }}
          path: ${{ runner.temp }}/macos-diagnostics
          if-no-files-found: warn
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: VideoDock-macos-${{ matrix.arch }}
          path: ${{ runner.temp }}/VideoDock-macos-${{ matrix.arch }}.zip
          if-no-files-found: error
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        if: always() && steps.macos-cache.outcome == 'success' && steps.macos-cache.outputs.cache-hit != 'true'
        with:
          path: |
            ${{ github.workspace }}/target
            ~/.cargo/registry
          key: native-${{ runner.os }}-${{ runner.arch }}-1.99.1-${{ hashFiles('Cargo.lock') }}

      - name: Complete public macOS downloads with the packaged worker
        if: always() && steps.macos-package.outcome == 'success'
        timeout-minutes: 10
        env:
          QT_QPA_PLATFORM: cocoa
        run: |
          export PATH="$RUNNER_TEMP/VideoDock.app/Contents/MacOS:$PATH"
          export VIDEODOCK_TEST_PROOF_WORKER="$RUNNER_TEMP/VideoDock.app/Contents/MacOS/VideoDock"
          export VIDEODOCK_TEST_OUTPUT_DIR="$RUNNER_TEMP/native-downloads/files"
          export VIDEODOCK_DATA_DIR="$RUNNER_TEMP/native-downloads/profile"
          mkdir -p "$RUNNER_TEMP/native-downloads"
          set +e
          cargo test -p videodock-core --test catalog_downloads tiktok_adaptive_audio --locked -- --ignored --exact --nocapture > "$RUNNER_TEMP/native-downloads/tiktok.log" 2>&1
          tiktok_status=$?
          cargo test -p videodock-core --test youtube_downloads zoo_complete_240p --locked -- --ignored --exact --nocapture > "$RUNNER_TEMP/native-downloads/youtube.log" 2>&1
          youtube_status=$?
          cargo test -p videodock-core --test youtube_downloads reported_shorts_complete_1080p --locked -- --ignored --exact --nocapture > "$RUNNER_TEMP/native-downloads/shorts.log" 2>&1
          shorts_status=$?
          python3 - "$tiktok_status" "$youtube_status" "$shorts_status" "$RUNNER_TEMP/native-downloads/result.json" <<'PYTHON'
          import json, pathlib, sys
          pathlib.Path(sys.argv[4]).write_text(json.dumps(dict(zip(['tiktok','youtube','shorts'], map(int, sys.argv[1:4])))) + "\n")
          PYTHON
          test "$tiktok_status" -eq 0 && test "$youtube_status" -eq 0 && test "$shorts_status" -eq 0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: macos-public-downloads-${{ matrix.arch }}
          path: ${{ runner.temp }}/native-downloads
          if-no-files-found: warn

      - name: Remove ephemeral signing keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/videodock-signing.keychain-db" || true

  windows:
    if: github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'native' || inputs.platform == 'windows'
    runs-on: windows-2022
    timeout-minutes: 120
    env:
      CARGO_BUILD_JOBS: 1
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install build tools
        shell: pwsh
        run: |
          choco install nasm llvm --yes --no-progress
          $ffmpegArchive = "$env:RUNNER_TEMP/ffmpeg-9.0.2-essentials_build.zip"
          Invoke-WebRequest 'https://github.com/GyanD/codexffmpeg/releases/download/9.0.2/ffmpeg-9.0.2-essentials_build.zip' -OutFile $ffmpegArchive
          if ((Get-FileHash $ffmpegArchive -Algorithm SHA256).Hash.ToLowerInvariant() -ne '60f467265b1e312373dbcd92200c2618a74850f98d3d078e94296bb3fa2047ba') { throw 'FFmpeg archive checksum mismatch' }
          Expand-Archive $ffmpegArchive "$env:RUNNER_TEMP/FFmpeg"
          "$env:RUNNER_TEMP/FFmpeg/ffmpeg-9.0.2-essentials_build/bin" >> $env:GITHUB_PATH
          $innoInstaller = "$env:RUNNER_TEMP/innosetup-7.1.1-x64.exe"
          Invoke-WebRequest 'https://github.com/jrsoftware/issrc/releases/download/is-7_1_1/innosetup-7.1.1-x64.exe' -OutFile $innoInstaller
          if ((Get-FileHash $innoInstaller -Algorithm SHA256).Hash.ToLowerInvariant() -ne '8a5a6711c3766a6e5fb74f280ba0e3551e719ce94538d901fdbd1f8f9920b3f0') { throw 'Inno Setup checksum mismatch' }
          $setup = Start-Process $innoInstaller -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/CURRENTUSER', "/DIR=$env:RUNNER_TEMP/InnoSetup") -Wait -PassThru
          if ($setup.ExitCode -ne 0) { throw 'Inno Setup installation failed' }
          "$env:RUNNER_TEMP/InnoSetup" >> $env:GITHUB_PATH
          python -m pip install aqtinstall==3.3.0 libclang==18.1.1
          python -m aqt install-qt windows desktop 6.8.3 win64_msvc2022_64 -O "$env:RUNNER_TEMP/Qt" -m qtwebengine qt5compat qtpositioning qtwebchannel qtshadertools qtserialport
          "$env:RUNNER_TEMP/Qt/6.8.3/msvc2022_64/bin" >> $env:GITHUB_PATH
          "C:/Program Files/NASM" >> $env:GITHUB_PATH
          $clang = python -c "import pathlib,clang; print(pathlib.Path(clang.__file__).parent / 'native')"
          "LIBCLANG_PATH=$clang" >> $env:GITHUB_ENV
          rustup toolchain install 1.99.1 --profile minimal
          rustup override set 1.99.1
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        id: windows-cache
        with:
          path: |
            ${{ github.workspace }}/target
            ~/.cargo/registry
          key: native-${{ runner.os }}-${{ runner.arch }}-1.99.1-${{ hashFiles('Cargo.lock') }}
      - name: Verify Windows package staging rollback
        run: powershell -NoProfile -File scripts/rust/tests/check-windows-staging.ps1
      - name: Test and build Windows package
        id: windows-tests
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64
          if errorlevel 1 exit /b 1
          cargo test --workspace --locked
          if errorlevel 1 exit /b 1
      - name: Build Windows QA candidate
        id: windows-candidate
        if: always() && steps.windows-cache.outcome == 'success'
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64
          if errorlevel 1 exit /b 1
          powershell -NoProfile -File scripts/rust/build-windows.ps1
      - name: Verify installed worker with clean PATH
        id: windows-worker
        if: always() && steps.windows-candidate.outcome == 'success'
        shell: pwsh
        run: |
          $python = (Get-Command python).Source
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          & $python crates/desktop/tests/proof_worker.py "$env:CARGO_TARGET_DIR/package/VideoDock/VideoDock.exe" --proxy --startup
          if ($LASTEXITCODE -ne 0) { throw 'Installed proof worker failed' }
          Compress-Archive -Path "$env:CARGO_TARGET_DIR/package/VideoDock/*" -DestinationPath "$env:RUNNER_TEMP/VideoDock-windows-x64.zip"
      - name: Diagnose Windows DNS test in isolation
        if: failure()
        shell: pwsh
        run: |
          $test = Get-ChildItem "$env:CARGO_TARGET_DIR/debug/deps/videodock_media-*.exe" | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if ($test) { & $test.FullName dns::tests::anonymous_worker_bootstrap_is_pinned_and_never_bypasses_a_proxy --exact --nocapture }
      - name: Build Windows installer
        id: windows-installer
        if: always() && steps.windows-worker.outcome == 'success'
        shell: pwsh
        run: |
          & scripts/rust/package-windows.ps1 -SourceDirectory "$env:CARGO_TARGET_DIR/package/VideoDock" -OutputDirectory "$env:RUNNER_TEMP"
          if ($LASTEXITCODE -ne 0) { throw 'Installer packaging failed' }
      - name: Verify native Windows interface and real Engine in English and Russian
        if: always() && steps.windows-worker.outcome == 'success'
        timeout-minutes: 15
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64
          if errorlevel 1 exit /b 1
          pwsh -NoProfile -File crates/desktop/tests/check-appearance.ps1 "%RUNNER_TEMP%/windows-appearance"
      - name: Complete public Windows downloads with the packaged worker
        if: always() && steps.windows-worker.outcome == 'success'
        shell: pwsh
        run: |
          $package = "$env:CARGO_TARGET_DIR/package/VideoDock"
          $report = "$env:RUNNER_TEMP/windows-downloads"
          New-Item -ItemType Directory -Force $report | Out-Null
          $env:PATH = "$package;$env:PATH"
          $env:VIDEODOCK_TEST_PROOF_WORKER = "$package/VideoDock.exe"
          $env:VIDEODOCK_TEST_OUTPUT_DIR = "$report/files"
          $env:VIDEODOCK_DATA_DIR = "$report/profile"
          $results = [ordered]@{}
          $cases = @(
            @('tiktok', 'catalog_downloads', 'tiktok_adaptive_audio'),
            @('youtube', 'youtube_downloads', 'zoo_complete_240p'),
            @('shorts', 'youtube_downloads', 'reported_shorts_complete_1080p')
          )
          foreach ($case in $cases) {
            & cargo test -p videodock-core --test $case[1] $case[2] --locked -- --ignored --exact --nocapture *> "$report/$($case[0]).log"
            $status = $LASTEXITCODE
            if ($status -eq 0 -and !(Select-String -Quiet -Path "$report/$($case[0]).log" -Pattern 'test result: ok\. 1 passed; 0 failed;')) { $status = 1 }
            $results[$case[0]] = $status
          }
          $results | ConvertTo-Json | Set-Content -Encoding utf8 "$report/result.json"
          if (@($results.Values | Where-Object { $_ -ne 0 }).Count) { throw 'Public Windows download/decode failed; inspect windows-public-downloads' }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: windows-public-downloads
          path: ${{ runner.temp }}/windows-downloads
          if-no-files-found: warn
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: windows-interface
          path: ${{ runner.temp }}/windows-appearance
          if-no-files-found: warn
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && steps.windows-installer.outcome == 'success'
        with:
          name: VideoDock-windows-x64
          path: |
            ${{ runner.temp }}/VideoDock-windows-x64.zip
            ${{ runner.temp }}/VideoDock-*-windows-x64-Setup.exe
          if-no-files-found: error
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        if: always() && steps.windows-cache.outcome == 'success' && steps.windows-cache.outputs.cache-hit != 'true'
        with:
          path: |
            ${{ github.workspace }}/target
            ~/.cargo/registry
          key: native-${{ runner.os }}-${{ runner.arch }}-1.99.1-${{ hashFiles('Cargo.lock') }}
