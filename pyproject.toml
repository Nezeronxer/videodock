[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "videodock"
version = "0.1.0"
description = "Desktop video and audio downloader"
requires-python = ">=3.12"
license = "MIT"
authors = [{name = "Nezeronxer"}]
dependencies = ["PySide6-Essentials>=6.8,<7", "yt-dlp[default]>=2026.10.26"]

[project.gui-scripts]
videodock = "videodock.__main__:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.14", "pyinstaller>=6.16", "pip-audit>=2.9", "bandit>=1.8"]

[tool.setuptools.packages.find]
include = ["videodock*"]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/test_ui.py" = ["E402"]
