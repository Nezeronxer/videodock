[package]
name = "videodock-desktop"
version = "0.2.0"
edition = "2021"
license = "GPL-3.0-or-later"
build = "build.rs"

[dependencies]
anyhow = "1"
cxx = "1"
cxx-qt = "0.10"
cxx-qt-lib = { version = "0.10", features = ["qt_gui", "qt_qml", "qt_quickcontrols"] }
serde_json = "1"
url = "2"
videodock-core = { path = "../core" }
videodock-media = { path = "../media" }

[build-dependencies]
cxx-qt-build = { version = "0.10", features = ["link_qt_object_files"] }
