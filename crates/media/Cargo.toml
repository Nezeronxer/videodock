[package]
name = "videodock-media"
version.workspace = true
edition.workspace = true
authors.workspace = true
license = "GPL-3.0"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13", default-features = false, features = ["http2", "json", "stream", "rustls", "gzip", "brotli", "form", "query"] }
tokio = { version = "1", features = ["fs", "rt-multi-thread", "macros", "time", "sync"] }
url = "2"
regex = "1"
scraper = "0.24"

rustypipe = { path = "../../vendor/rustypipe" }
wreq = { version = "=0.16.3", default-features = false }
time = { version = "0.3", features = ["parsing", "formatting"] }
